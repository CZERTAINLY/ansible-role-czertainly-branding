---
- name: Copy 3KeyCompany templated files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: motd.j2,
        dest: /etc/motd }
    - { src: issue.j2,
        dest: /etc/issue }
    - { src: issue.net.j2,
        dest: /etc/issue.net.j2 }
  tags:
    - branding_welcome_msg

- name: copy ILM logo for plymouth
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: ilm.png,
        dest: /usr/share/plymouth/themes/spinner/watermark.png }
  tags:
    - branding_plymouth
  notify: update-plymouth

- name: copy ILM logo for grub
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: ilm.tga,
        dest: /boot/grub/ilm.tga }
  tags:
    - branding_grub
  notify: update-grub

- name: Update /etc/defaults/grub with appliance name
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_DISTRIBUTOR='
    line: 'GRUB_DISTRIBUTOR="ILM Appliance ({{ appliance_version }})"'
  tags:
    - branding_grub
  notify: update-grub

- name: Update /etc/defaults/grub with appliance name
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_BACKGROUND'
    insertafter: '^GRUB_DISTRIBUTOR='
    line: "GRUB_BACKGROUND=/boot/grub/ilm.tga"
  tags:
    - branding_grub
  notify: update-grub
